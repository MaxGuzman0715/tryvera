<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume</title>
    <style>
      :root {
        --navy: #1a2d4a;
        --navy-deep: #0f1a2e;
        --body: #2d3748;
        --muted: #4a5568;
        --rule: #cbd5e1;
        --rule-thick: var(--navy);
        --paper: #ffffff;
        --hint: #718096;
      }
      * {
        box-sizing: border-box;
      }
      @page {
        margin: 0;
      }
      body.doc.theme-navy-center {
        margin: 0;
        font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 10pt;
        line-height: 1.45;
        color: var(--body);
        background: var(--paper);
      }
      body.doc.theme-navy-center .sheet {
        max-width: 7.2in;
        margin: 0 auto;
        padding: 0.2in 0 0.35in;
      }
      body.doc.theme-navy-center .content h1 {
        margin: 0;
        text-align: center;
        font-size: 20pt;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--navy);
        font-family: inherit;
      }
      body.doc.theme-navy-center .content p.resume-headline {
        margin: 0.35rem 0 0.2rem;
        text-align: center;
        font-size: 10.5pt;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--navy);
      }
      body.doc.theme-navy-center .content p.contact-line {
        margin: 0 0 0.5rem;
        text-align: center;
        font-size: 9pt;
        color: var(--muted);
        font-weight: 400;
        letter-spacing: 0.02em;
        padding-bottom: 0.55rem;
        border-bottom: 4px solid var(--rule-thick);
      }
      body.doc.theme-navy-center .content h2 {
        margin: 0.85rem 0 0.4rem;
        padding-top: 0.55rem;
        border-top: 1px solid var(--rule);
        font-size: 9.75pt;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--navy);
        font-family: inherit;
      }
      body.doc.theme-navy-center .content h2:first-of-type {
        margin-top: 0.35rem;
        border-top: none;
        padding-top: 0;
      }
      body.doc.theme-navy-center .content h3 {
        margin: 0.5rem 0 0.15rem;
        font-size: 10.5pt;
        font-weight: 700;
        color: var(--navy-deep);
        font-family: inherit;
      }
      body.doc.theme-navy-center .content p.template-hint {
        display: none;
      }
      body.doc.theme-navy-center .content p {
        margin: 0.22rem 0;
      }
      body.doc.theme-navy-center .content p.bullet {
        margin-left: 0.15in;
        text-indent: -0.1in;
        padding-left: 0.1in;
      }
      body.doc.theme-navy-center .content p.spacer {
        margin: 0.08rem 0;
        height: 0.2rem;
      }
    </style>
  </head>
  <body class="doc theme-{{THEME_CLASS}}">
    <div class="sheet">
      <main class="content">{{BODY}}</main>
    </div>
  </body>
</html>
