<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume</title>
    <style>
      /*
        Executive — made for Sean Fitzgerald (founder/CEO who engineers). Deep navy
        header band with a serif name, brass rule beneath, serif small-caps style
        section labels with a brass hairline, clean sans body for density.

        Print/ATS constraints (see resume-standard.html for the measurements):
        - letter-spacing stays at or below 0.08em (0.09em+ splits headings in the
          PDF text layer: "E XPERIENCE").
        - text-transform: uppercase ONLY on h2 section labels.
        - no positioned headings (a positioned h2 is painted, and extracted, last).
        - bullets arrive as <p class="bullet">• text</p>; hanging indent, no ::before.
      */
      :root {
        --navy: #13233f;
        --navy-2: #1d3357;
        --brass: #b08d57;
        --brass-soft: #e9dfcd;
        --ink: #13233f;
        --body: #2a2f37;
        --muted: #5d6572;
        --on-navy: #ffffff;
        --on-navy-muted: #c9d3e3;
        --hairline: #dde1e7;
        --paper: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      @page {
        margin: 0;
      }
      body.doc.theme-executive {
        margin: 0;
        font-family: "Segoe UI", Calibri, "Helvetica Neue", Arial, sans-serif;
        font-size: 10pt;
        line-height: 1.4;
        color: var(--body);
        background: var(--paper);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body.doc.theme-executive .sheet {
        max-width: 7.3in;
        margin: 0 auto;
        padding: 0.34in 0 0.4in;
      }

      /* ── header band ────────────────────────────────────────────────────── */
      body.doc.theme-executive .content h1,
      body.doc.theme-executive .content p.resume-headline,
      body.doc.theme-executive .content p.contact-line {
        padding-left: 0.3in;
        padding-right: 0.3in;
        background: var(--navy);
        text-transform: none;
      }
      body.doc.theme-executive .content h1 {
        margin: 0;
        padding-top: 0.2in;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 25pt;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: 0.02em;
        color: var(--on-navy);
      }
      body.doc.theme-executive .content p.resume-headline {
        margin: 0;
        padding-top: 0.32rem;
        font-size: 10.5pt;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--brass);
      }
      body.doc.theme-executive .content p.contact-line {
        margin: 0;
        padding-top: 0.36rem;
        padding-bottom: 0.18in;
        font-size: 8.75pt;
        line-height: 1.5;
        color: var(--on-navy-muted);
        border-bottom: 3pt solid var(--brass);
      }

      /* ── section headings ───────────────────────────────────────────────── */
      body.doc.theme-executive .content h2 {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.8rem 0 0.34rem;
        padding: 0 0.3in;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 10.5pt;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--navy);
        break-after: avoid;
      }
      body.doc.theme-executive .content h2::after {
        content: "";
        flex: 1 1 auto;
        height: 1pt;
        background: linear-gradient(90deg, var(--brass), var(--brass-soft) 45%, var(--hairline));
      }

      /* ── role headings and location ─────────────────────────────────────── */
      body.doc.theme-executive .content h3 {
        margin: 0.52rem 0 0;
        padding: 0 0.3in;
        font-size: 10.5pt;
        font-weight: 700;
        letter-spacing: 0;
        color: var(--navy);
        font-family: inherit;
        text-transform: none;
        break-after: avoid;
      }
      body.doc.theme-executive .content h2 + h3 {
        margin-top: 0.1rem;
      }
      body.doc.theme-executive .content h3 + p:not(.bullet):not(.contact-line):not(.resume-headline) {
        margin: 0.06rem 0 0.24rem;
        padding: 0 0.3in;
        font-size: 8.75pt;
        font-style: italic;
        color: var(--muted);
      }

      /* ── body copy and bullets ──────────────────────────────────────────── */
      body.doc.theme-executive .content p {
        margin: 0.3rem 0;
        padding: 0 0.3in;
      }
      body.doc.theme-executive .content p.bullet {
        margin: 0.1rem 0;
        padding-left: calc(0.3in + 0.68em);
        padding-right: 0.3in;
        text-indent: -0.68em;
        font-size: 9.75pt;
        line-height: 1.38;
        color: var(--body);
      }
      body.doc.theme-executive .content p.spacer {
        margin: 0;
        padding: 0;
        height: 0.22rem;
      }
      body.doc.theme-executive .content strong,
      body.doc.theme-executive .content b {
        font-weight: 700;
        color: var(--navy);
      }
      body.doc.theme-executive .content a {
        color: inherit;
        text-decoration: none;
      }

      body.doc.theme-executive .keep-together {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* ── timeline rows (### Dates | Role) ───────────────────────────────── */
      body.doc.theme-executive .resume-role-row {
        display: grid;
        grid-template-columns: 1.28in 1fr;
        gap: 0 0.2in;
        padding: 0 0.3in;
        margin: 0.5rem 0 0;
        break-inside: avoid;
      }
      body.doc.theme-executive .resume-role-row p.resume-role-dates {
        margin: 0.1rem 0 0;
        padding: 0;
        font-size: 8.75pt;
        font-weight: 600;
        color: var(--brass);
      }
      body.doc.theme-executive .resume-role-main {
        min-width: 0;
        border-left: 1pt solid var(--brass-soft);
        padding-left: 0.16in;
      }
      body.doc.theme-executive .resume-role-main h3,
      body.doc.theme-executive .resume-role-main p,
      body.doc.theme-executive .resume-role-main p.bullet {
        padding-left: 0;
        padding-right: 0;
      }
      body.doc.theme-executive .resume-role-main p.bullet {
        padding-left: 0.68em;
        text-indent: -0.68em;
      }
      body.doc.theme-executive .resume-role-main h3 {
        margin-top: 0;
      }

      /* ── grid fences / language bars ────────────────────────────────────── */
      body.doc.theme-executive .resume-grid-col {
        min-width: 0;
      }
      body.doc.theme-executive .resume-grid-col p,
      body.doc.theme-executive .resume-grid-col p.bullet {
        padding-left: 0;
        padding-right: 0;
      }
      body.doc.theme-executive .resume-grid-col p.bullet {
        padding-left: 0.68em;
        text-indent: -0.68em;
      }
      body.doc.theme-executive .resume-lang-bars {
        padding: 0 0.3in;
      }
      body.doc.theme-executive .resume-lang-row {
        margin: 0.26rem 0;
        break-inside: avoid;
      }
      body.doc.theme-executive .resume-lang-name {
        font-size: 9.25pt;
        font-weight: 600;
        color: var(--navy);
      }
      body.doc.theme-executive .resume-lang-meter {
        margin-top: 0.14rem;
        height: 5px;
        background: var(--hairline);
        border-radius: 3px;
        overflow: hidden;
      }
      body.doc.theme-executive .resume-lang-fill {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--navy), var(--brass));
        border-radius: 3px;
      }

      body.doc.theme-executive .template-hint {
        margin: 0.05rem 0 0.2rem;
        padding: 0 0.3in;
        font-size: 7.5pt;
        color: #9aa4ae;
      }
    </style>
  </head>
  <body class="doc theme-{{THEME_CLASS}}">
    <div class="sheet">
      <main class="content">{{BODY}}</main>
    </div>
  </body>
</html>
