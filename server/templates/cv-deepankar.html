<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV</title>
    <style>
      :root {
        --navy: #1f3b63;
        --steel: #3f5f7f;
        --body: #222831;
        --muted: #55606b;
        --rule: #b8c6d6;
        --rule-strong: #6f8aa6;
        --paper: #ffffff;
        --hint: #718096;
      }
      * {
        box-sizing: border-box;
      }
      @page {
        margin: 0;
      }
      body.doc.cv-doc.theme-deepankar {
        margin: 0;
        font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 9.75pt;
        line-height: 1.42;
        color: var(--body);
        background: var(--paper);
      }
      body.doc.cv-doc.theme-deepankar .sheet {
        max-width: 7.2in;
        margin: 0 auto;
        padding: 0 0 0.35in;
      }
      body.doc.cv-doc.theme-deepankar .cv-label {
        text-align: center;
        font-size: 7.5pt;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      body.doc.cv-doc.theme-deepankar .content h1 {
        margin: 0;
        text-align: center;
        font-size: 18pt;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--navy);
      }
      body.doc.cv-doc.theme-deepankar .content p.resume-headline {
        margin: 0.26rem 0 0.14rem;
        text-align: center;
        font-size: 11pt;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-transform: none;
        color: var(--steel);
      }
      body.doc.cv-doc.theme-deepankar .content p.contact-line {
        margin: 0 0 0.45rem;
        text-align: center;
        font-size: 8.75pt;
        color: var(--muted);
        padding-bottom: 0.45rem;
        border-bottom: 1.5px solid var(--rule-strong);
      }
      body.doc.cv-doc.theme-deepankar .content h2 {
        margin: 0.7rem 0 0.32rem;
        padding-bottom: 0.16rem;
        font-size: 9.75pt;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--steel);
        border-bottom: 1.5px solid var(--rule);
      }
      body.doc.cv-doc.theme-deepankar .content h2:first-of-type {
        margin-top: 0.35rem;
      }
      body.doc.cv-doc.theme-deepankar .content h3 {
        margin: 0.42rem 0 0.1rem;
        font-size: 10pt;
        font-weight: 700;
        color: var(--navy);
      }
      body.doc.cv-doc.theme-deepankar .content p.template-hint {
        display: none;
      }
      body.doc.cv-doc.theme-deepankar .content p {
        margin: 0.16rem 0;
      }
      body.doc.cv-doc.theme-deepankar .content p.bullet {
        margin-left: 0.14in;
        text-indent: -0.09in;
      }
      body.doc.cv-doc.theme-deepankar .content p.spacer {
        margin: 0.06rem 0;
        height: 0.18rem;
      }
    </style>
  </head>
  <body class="doc cv-doc theme-{{THEME_CLASS}}">
    <div class="sheet">
      <main class="content">{{BODY}}</main>
    </div>
  </body>
</html>
