<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cover Letter</title>
    <style>
      /*
        Classic serif cover letter — matches resume-classic.html.

        Note: generation.ts routes cover letters through the plain PDFKit path, so this
        shell is only used if that ever changes or a caller renders a cover letter via
        the template path directly. It exists so the `classic` registry entry resolves:
        a registry entry pointing at a missing file throws inside loadTemplate() and
        falls back to an UNTHEMED PDF, which is the bug this file closes.

        Same text-layer rules as the résumé: letter-spacing <= 0.08em (measured), uppercase on h2 only.
      */
      :root {
        --ink: #14161a;
        --muted: #4a5056;
        --rule: #b9bfc6;
      }
      * {
        box-sizing: border-box;
      }
      @page {
        margin: 0;
      }
      body.doc {
        margin: 0;
        font-family: Georgia, "Times New Roman", Times, serif;
        font-size: 11pt;
        line-height: 1.58;
        color: var(--ink);
        background: #fff;
      }
      .sheet {
        width: 100%;
        margin: 0;
        padding: 0.12in 0.35in 0.4in;
      }
      body.doc.theme-classic .content h1 {
        font-size: 20pt;
        font-weight: 700;
        letter-spacing: -0.01em;
        text-align: center;
        margin: 0 0 0.1rem;
      }
      body.doc.theme-classic .content p.contact-line {
        text-align: center;
        margin: 0 0 0.2rem;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        font-size: 9pt;
        color: var(--muted);
        letter-spacing: 0.01em;
      }
      body.doc.theme-classic .content p.contact-line::after {
        content: "";
        display: block;
        margin: 0.4rem auto 0;
        width: 100%;
        border-top: 1.6pt solid var(--ink);
        border-bottom: 0.5pt solid var(--ink);
        padding-bottom: 1.6pt;
      }
      body.doc.theme-classic .content h2 {
        font-size: 10pt;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 0.8rem 0 0.3rem;
        padding-bottom: 0.14rem;
        border-bottom: 0.75pt solid var(--rule);
      }
      body.doc.theme-classic .content h3 {
        font-size: 11pt;
        font-weight: 700;
        margin: 0.5rem 0 0.12rem;
      }
      body.doc.theme-classic .content p {
        margin: 0.5rem 0;
        text-align: left;
      }
      body.doc.theme-classic .content p.bullet {
        padding-left: 0.68em;
        text-indent: -0.68em;
        margin: 0.16rem 0;
      }
      body.doc.theme-classic .content p.spacer {
        margin: 0.1rem 0;
        height: 0.3rem;
      }
      body.doc.theme-classic .keep-together {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      body.doc.theme-classic .content p.template-hint {
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        font-size: 7.25pt;
        font-style: italic;
        color: #8b9298;
        margin: 0.04rem 0 0.24rem;
      }
    </style>
  </head>
  <body class="doc cv-doc theme-{{THEME_CLASS}}">
    <div class="sheet">
      <main class="content">{{BODY}}</main>
    </div>
  </body>
</html>
