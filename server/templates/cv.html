<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV</title>
    <style>
      :root {
        --ink: #141820;
        --muted: #5c6b7a;
        --rule: #dce2ea;
        --band: #1e3a5f;
        --paper: #fcfcfd;
        --hint: #718096;
      }
      * {
        box-sizing: border-box;
      }
      @page {
        margin: 0;
      }
      body.doc {
        margin: 0;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        font-size: 9.75pt;
        line-height: 1.4;
        color: var(--ink);
        background: var(--paper);
      }
      .sheet {
        max-width: 7.2in;
        margin: 0 auto;
        padding: 0 0 0.35in;
      }
      .cv-stripe {
        height: 6px;
        background: linear-gradient(90deg, var(--band), #3d6a9c);
        margin-bottom: 0.45rem;
      }
      .cv-label {
        font-size: 7.5pt;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--band);
        font-weight: 700;
        margin-bottom: 0.35rem;
      }
      .content :is(h1, h2, h3) {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 600;
        margin: 0;
      }
      .content h1 {
        font-size: 17pt;
        margin-top: 0;
        color: var(--band);
      }
      .content p.contact-line {
        margin: 0.15rem 0 0;
        font-size: 9pt;
        color: var(--muted);
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      }
      .content h2 {
        font-size: 9.5pt;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--band);
        border-bottom: 1px solid var(--rule);
        padding-bottom: 0.12rem;
        margin: 0.55rem 0 0.28rem;
      }
      .content h3 {
        font-size: 10pt;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        margin: 0.4rem 0 0.12rem;
      }
      .content p.template-hint {
        font-size: 7pt;
        color: var(--hint);
        font-style: italic;
        margin: 0.05rem 0 0.22rem;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      }
      .content p {
        margin: 0.18rem 0;
      }
      .content p.bullet {
        margin-left: 0.14in;
        text-indent: -0.1in;
      }
      .content p.spacer {
        margin: 0.1rem 0;
        height: 0.25rem;
      }
    </style>
  </head>
  <body class="doc cv-doc theme-{{THEME_CLASS}}">
    <div class="sheet">
      <div class="cv-stripe"></div>
      <main class="content">{{BODY}}</main>
    </div>
  </body>
</html>
