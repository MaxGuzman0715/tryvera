<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume</title>
    <style>
      /*
        Tryvera Standard — left-aligned header panel, teal accent rail on section
        headings, hanging-indent bullets.

        Print/ATS constraints this theme is built to (measured, not guessed):
        - letter-spacing stays at or below 0.10em. At 0.14em and above the PDF text
          layer breaks a heading into "S U M M A R Y", and an ATS segments a résumé
          by its section headings, so a broken heading costs more than a broken name.
        - text-transform: uppercase is used ONLY on h2 section labels. It rewrites the
          extracted text, which is harmless for "SUMMARY" but must never touch body
          copy, role headings or the contact line.
        - bullets arrive from markdownToHtml as <p class="bullet">• text</p>, with the
          glyph already inside the text. So no ::before marker here; the indent is a
          hanging indent instead, which is what keeps wrapped lines aligned under the
          text rather than under the bullet.
      */
      :root {
        --ink: #16202e;
        --body: #2c3440;
        --muted: #5c6672;
        --accent: #0f766e;
        --panel: #f0f7f6;
        --hairline: #e2e7ec;
        --paper: #ffffff;
        --meter-track: #e6ecec;
      }
      * {
        box-sizing: border-box;
      }
      @page {
        margin: 0;
      }
      body.doc.theme-standard {
        margin: 0;
        font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 10pt;
        line-height: 1.46;
        color: var(--body);
        background: var(--paper);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body.doc.theme-standard .sheet {
        max-width: 7.3in;
        margin: 0 auto;
        padding: 0.34in 0 0.4in;
      }

      /* ── header ─────────────────────────────────────────────────────────── */
      body.doc.theme-standard .content h1 {
        margin: 0;
        font-size: 23pt;
        font-weight: 750;
        line-height: 1.1;
        letter-spacing: -0.005em;
        color: var(--ink);
        font-family: inherit;
        text-transform: none;
      }
      body.doc.theme-standard .content p.resume-headline {
        margin: 0;
        padding-top: 0.28rem;
        font-size: 11pt;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--accent);
        text-transform: none;
      }
      body.doc.theme-standard .content p.contact-line {
        margin: 0;
        padding-top: 0.34rem;
        font-size: 9pt;
        font-weight: 400;
        line-height: 1.5;
        color: var(--muted);
        text-transform: none;
      }
      /* The header panel: soft tint, teal rule beneath. Everything before the first
         h2 sits inside it visually, achieved with a wrapper-free approach so the
         markdown fragment needs no extra markup. */
      body.doc.theme-standard .content h1,
      body.doc.theme-standard .content p.resume-headline,
      body.doc.theme-standard .content p.contact-line {
        padding-left: 0.26in;
        padding-right: 0.26in;
      }
      body.doc.theme-standard .content h1 {
        padding-top: 0.2in;
        background: var(--panel);
      }
      body.doc.theme-standard .content p.resume-headline {
        background: var(--panel);
      }
      body.doc.theme-standard .content p.contact-line {
        padding-bottom: 0.2in;
        background: var(--panel);
        border-bottom: 2.5pt solid var(--accent);
      }

      /* ── section headings ───────────────────────────────────────────────── */
      body.doc.theme-standard .content h2 {
        display: flex;
        align-items: center;
        gap: 0.42rem;
        margin: 0.9rem 0 0.42rem;
        padding: 0 0.26in;
        font-size: 9pt;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
        font-family: inherit;
        break-after: avoid;
      }
      /* short accent bar left of the label, hairline filling the rest */
      body.doc.theme-standard .content h2::before {
        content: "";
        flex: 0 0 auto;
        width: 3.5pt;
        height: 11pt;
        background: var(--accent);
        border-radius: 1pt;
      }
      body.doc.theme-standard .content h2::after {
        content: "";
        flex: 1 1 auto;
        height: 1pt;
        background: var(--hairline);
      }

      /* ── role headings and location ─────────────────────────────────────── */
      body.doc.theme-standard .content h3 {
        margin: 0.6rem 0 0;
        padding: 0 0.26in;
        font-size: 10.5pt;
        font-weight: 700;
        letter-spacing: 0;
        color: var(--ink);
        font-family: inherit;
        text-transform: none;
        break-after: avoid;
      }
      body.doc.theme-standard .content h2 + h3 {
        margin-top: 0.1rem;
      }
      /* The location line is the first plain <p> after a role heading. */
      body.doc.theme-standard .content h3 + p:not(.bullet):not(.contact-line):not(.resume-headline) {
        margin: 0.08rem 0 0.22rem;
        padding: 0 0.26in;
        font-size: 8.75pt;
        font-weight: 500;
        color: var(--muted);
      }

      /* ── body copy and bullets ──────────────────────────────────────────── */
      body.doc.theme-standard .content p {
        margin: 0.3rem 0;
        padding: 0 0.26in;
      }
      body.doc.theme-standard .content p.bullet {
        margin: 0.14rem 0;
        padding-left: calc(0.26in + 0.68em);
        padding-right: 0.26in;
        text-indent: -0.68em;
        font-size: 9.75pt;
        line-height: 1.44;
        color: var(--body);
      }
      body.doc.theme-standard .content p.spacer {
        margin: 0;
        padding: 0;
        height: 0.22rem;
      }
      body.doc.theme-standard .content strong,
      body.doc.theme-standard .content b {
        font-weight: 700;
        color: var(--ink);
      }
      body.doc.theme-standard .content a {
        color: inherit;
        text-decoration: none;
      }

      /* ── keep-together (education block) ───────────────────────────────── */
      body.doc.theme-standard .keep-together {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* ── timeline rows (### Dates | Role) ───────────────────────────────── */
      body.doc.theme-standard .resume-role-row {
        display: grid;
        grid-template-columns: 1.28in 1fr;
        gap: 0 0.2in;
        padding: 0 0.26in;
        margin: 0.5rem 0 0;
        break-inside: avoid;
      }
      body.doc.theme-standard .resume-role-row p.resume-role-dates {
        margin: 0.1rem 0 0;
        padding: 0;
        font-size: 8.75pt;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--accent);
      }
      body.doc.theme-standard .resume-role-main {
        min-width: 0;
        border-left: 1pt solid var(--hairline);
        padding-left: 0.16in;
      }
      body.doc.theme-standard .resume-role-main h3,
      body.doc.theme-standard .resume-role-main p,
      body.doc.theme-standard .resume-role-main p.bullet {
        padding-left: 0;
        padding-right: 0;
      }
      body.doc.theme-standard .resume-role-main p.bullet {
        padding-left: 0.68em;
        text-indent: -0.68em;
      }
      body.doc.theme-standard .resume-role-main h3 {
        margin-top: 0;
      }

      /* ── grid fences (:::grid-2 / :::grid-3) ────────────────────────────── */
      body.doc.theme-standard .resume-grid-col {
        min-width: 0;
      }
      body.doc.theme-standard .resume-grid-col p,
      body.doc.theme-standard .resume-grid-col p.bullet {
        padding-left: 0;
        padding-right: 0;
      }
      body.doc.theme-standard .resume-grid-col p.bullet {
        padding-left: 0.68em;
        text-indent: -0.68em;
      }

      /* ── language bars (:::lang-bars) ───────────────────────────────────── */
      body.doc.theme-standard .resume-lang-bars {
        padding: 0 0.26in;
      }
      body.doc.theme-standard .resume-lang-row {
        margin: 0.26rem 0;
        break-inside: avoid;
      }
      body.doc.theme-standard .resume-lang-name {
        font-size: 9.25pt;
        font-weight: 600;
        color: var(--ink);
      }
      body.doc.theme-standard .resume-lang-meter {
        margin-top: 0.14rem;
        height: 5px;
        background: var(--meter-track);
        border-radius: 3px;
        overflow: hidden;
      }
      body.doc.theme-standard .resume-lang-fill {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), #14b8a6);
        border-radius: 3px;
      }

      /* ── layout debug hints (ENPPLY_RESUME_TEMPLATE_HINTS=1) ────────────── */
      body.doc.theme-standard .template-hint {
        margin: 0.05rem 0 0.2rem;
        padding: 0 0.26in;
        font-size: 7.5pt;
        color: #9aa4ae;
      }
    </style>
  </head>
  <body class="doc theme-{{THEME_CLASS}}">
    <div class="sheet">
      <main class="content">{{BODY}}</main>
    </div>
  </body>
</html>
